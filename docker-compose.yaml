version: '3.8'

x-node-service: &node-service
  image: node:18-alpine
  network_mode: "host"

services:
  # ==========================================
  # HOSPITAL BACKENDS (Ports 4001-4006)
  # ==========================================
  h-ipfs-service:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/ipfs-service:/app
    ports:
      - "4006:4006"
    command: /bin/sh -c "npm install && npm start"

  h-peer0-api:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer0-api:/app
    ports:
      - "4001:4001"
    command: /bin/sh -c "npm install && npm start"

  h-peer1-api:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer1-api:/app
    ports:
      - "4002:4002"
    command: /bin/sh -c "npm install && npm start"

  h-peer2-api:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/peer2-api:/app
    ports:
      - "4003:4003"
    command: /bin/sh -c "npm install && npm start"

  h-extorg-api:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/extorg-api:/app
    ports:
      - "4004:4004"
    command: /bin/sh -c "npm install && npm start"

  h-patient-api:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-backend-v3/patient-api:/app
    ports:
      - "4005:4005"
    command: /bin/sh -c "npm install && npm start"

  # ==========================================
  # HOSPITAL FRONTENDS
  # ==========================================
  h-hospital-portal:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/hospital-portal:/app
    ports:
      - "5173:5173"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  h-patient-portal:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/hospital/EHR_hospitalOrg-main/ehr-frontend-v2/patient-portal:/app
    ports:
      - "5174:5174"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

  # ==========================================
  # PHARMACY ORG
  # ==========================================
  p-backend:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/backend:/app
    ports:
      - "3000:3000"
    command: /bin/sh -c "npm install && npm start"

  p-manager:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/manager:/app
    ports:
      - "3001:3001"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"

  p-employee:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/employee:/app
    ports:
      - "3002:3002"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3002"

  p-inventory:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/inventory:/app
    ports:
      - "3003:3003"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3003"

  p-patient:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/patient:/app
    ports:
      - "3004:3004"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3004"

  p-billing:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/billing:/app
    ports:
      - "3005:3005"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3005"

  p-frontend:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/pharmacy/fabric-network-swarm/app/frontend:/app
    ports:
      - "5175:5175"
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"

  # ==========================================
  # LAB ORG
  # ==========================================
  l-node-gateway:
    <<: *node-service
    working_dir: /app
    volumes:
      - ./orgs/lab/EHR-LABORG-main/client/node-gateway:/app
    ports:
      - "3006:3000"
    command: /bin/sh -c "npm install && npm run web"
