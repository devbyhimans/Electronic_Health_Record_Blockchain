events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Resolve Compose service names at request time. This lets the optional
    # dashboard run through Nginx without requiring every other app container
    # to be started first.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream h_patient_portal { zone h_patient_portal 64k; server h-patient-portal:5174 resolve; }
    upstream h_peer0_api { zone h_peer0_api 64k; server h-peer0-api:4001 resolve; }
    upstream h_peer1_api { zone h_peer1_api 64k; server h-peer1-api:4002 resolve; }
    upstream h_peer2_api { zone h_peer2_api 64k; server h-peer2-api:4003 resolve; }
    upstream h_extorg_api { zone h_extorg_api 64k; server h-extorg-api:4004 resolve; }
    upstream h_patient_api { zone h_patient_api 64k; server h-patient-api:4005 resolve; }
    upstream h_ipfs_service { zone h_ipfs_service 64k; server h-ipfs-service:4006 resolve; }
    upstream h_dashboard_portal { zone h_dashboard_portal 64k; server h-dashboard-portal:5176 resolve; }
    upstream h_dashboard_api { zone h_dashboard_api 64k; server h-dashboard-api:4010 resolve; }
    upstream p_manager { zone p_manager 64k; server p-manager:3001 resolve; }
    upstream p_employee { zone p_employee 64k; server p-employee:3002 resolve; }
    upstream p_inventory { zone p_inventory 64k; server p-inventory:3003 resolve; }
    upstream p_patient { zone p_patient 64k; server p-patient:3004 resolve; }
    upstream p_billing { zone p_billing 64k; server p-billing:3005 resolve; }
    upstream p_backend { zone p_backend 64k; server p-backend:3000 resolve; }
    upstream p_frontend { zone p_frontend 64k; server p-frontend:5175 resolve; }
    upstream l_node_gateway { zone l_node_gateway 64k; server l-node-gateway:3000 resolve; }
    upstream h_hospital_portal { zone h_hospital_portal 64k; server h-hospital-portal:5173 resolve; }

    # Map HTTP Upgrade header for WebSocket proxying (Vite HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # ══════════════════════════════════════════════════
        # HOSPITAL ORG
        # ══════════════════════════════════════════════════

        # Redirect /patient → /patient/ (no trailing slash fix)
        location = /patient {
            return 301 /patient/;
        }
        # Hospital Patient Portal  →  http://localhost/patient/
        location /patient/ {
            proxy_pass         http://h_patient_portal/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Hospital Backend APIs (for Postman / direct dev use)
        location /api/hospital/peer0/   { proxy_pass http://h_peer0_api/;    }
        location /api/hospital/peer1/   { proxy_pass http://h_peer1_api/;    }
        location /api/hospital/peer2/   { proxy_pass http://h_peer2_api/;    }
        location /api/hospital/extorg/  { proxy_pass http://h_extorg_api/;   }
        location /api/hospital/patient/ { proxy_pass http://h_patient_api/;   }
        location /api/hospital/ipfs/    { proxy_pass http://h_ipfs_service/; }

        # ══════════════════════════════════════════════════
        # Dashboard portal (production preview) and read-only aggregation API
        location = /dashboard {
            return 301 /dashboard/;
        }
        location /dashboard/ {
            proxy_pass         http://h_dashboard_portal;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /api/dashboard/ {
            proxy_pass         http://h_dashboard_api;
            access_log         off;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_buffering    off;
        }

        # PHARMACY ORG  (specific paths BEFORE /pharmacy/)
        # ══════════════════════════════════════════════════

        location = /pharmacy/manager   { return 301 /pharmacy/manager/;   }
        location /pharmacy/manager/ {
            proxy_pass         http://p_manager/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/employee   { return 301 /pharmacy/employee/;  }
        location /pharmacy/employee/ {
            proxy_pass         http://p_employee/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/inventory   { return 301 /pharmacy/inventory/; }
        location /pharmacy/inventory/ {
            proxy_pass         http://p_inventory/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/patient   { return 301 /pharmacy/patient/;   }
        location /pharmacy/patient/ {
            proxy_pass         http://p_patient/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /pharmacy/billing   { return 301 /pharmacy/billing/;   }
        location /pharmacy/billing/ {
            proxy_pass         http://p_billing/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Pharmacy Backend API
        location /api/pharmacy/ {
            proxy_pass         http://p_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # Pharmacy main frontend  →  http://localhost/pharmacy/
        location = /pharmacy   { return 301 /pharmacy/; }
        location /pharmacy/ {
            proxy_pass         http://p_frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ══════════════════════════════════════════════════
        # LAB ORG
        # ══════════════════════════════════════════════════

        location = /lab   { return 301 /lab/; }
        location /lab/ {
            proxy_pass         http://l_node_gateway/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ══════════════════════════════════════════════════
        # Single EHR workspace entry point. Existing portals remain available
        # through their dedicated routes and ports.
        # ══════════════════════════════════════════════════
        location = / {
            root /usr/share/nginx/html/hub;
            try_files /index.html =404;
        }
        location = /hub.css {
            root /usr/share/nginx/html/hub;
            default_type text/css;
            try_files /hub.css =404;
            add_header Cache-Control "no-cache";
        }
        location = /hub.js {
            root /usr/share/nginx/html/hub;
            default_type application/javascript;
            try_files /hub.js =404;
            add_header Cache-Control "no-cache";
        }
        location / {
            return 404;
        }
    }
}
