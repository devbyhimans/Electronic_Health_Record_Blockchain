services:
  ipfs.lab.example.com:
    container_name: ipfs.lab.example.com
    image: ipfs/kubo:v0.30.0
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs-data:/data/ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
      - "4001:4001"
    networks:
      - fabric

  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:${FABRIC_VERSION}
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LOCALMSPID=${ORDERER_MSP_ID}
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=${ORDERER_PORT}
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /root
    command: orderer
    volumes:
      - ../system-genesis-block/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - ../data/orderer:/var/hyperledger/production/orderer
    ports:
      - "${ORDERER_PORT}:${ORDERER_PORT}"
    networks:
      - fabric

  couchdb-peer0:
    container_name: couchdb-peer0.lab.example.com
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    networks:
      - fabric

  explorerdb:
    container_name: explorerdb.lab.example.com
    image: hyperledger/explorer-db:latest
    environment:
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hppoc -d fabricexplorer"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - explorer-db-data:/var/lib/postgresql/data
    networks:
      - fabric

  explorer:
    container_name: explorer.lab.example.com
    image: hyperledger/explorer:latest
    environment:
      - DATABASE_HOST=explorerdb
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=hppoc
      - DATABASE_PASSWD=password
      - DATABASE_PORT=5432
      - DISCOVERY_AS_LOCALHOST=false
    volumes:
      - ../explorer/config.json:/opt/explorer/app/platform/fabric/config.json
      - ../explorer/connection-profile:/opt/explorer/app/platform/fabric/connection-profile
      - ../organizations:/tmp/crypto
      - explorer-wallet:/opt/explorer/wallet
    ports:
      - "${EXPLORER_PORT:-8081}:8080"
    depends_on:
      explorerdb:
        condition: service_healthy
    networks:
      - fabric

  peer0.lab.example.com:
    container_name: peer0.lab.example.com
    image: hyperledger/fabric-peer:${FABRIC_VERSION}
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=${FABRIC_NETWORK}
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-peer0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_PEER_ID=${PEER0_HOST}
      - CORE_PEER_ADDRESS=${PEER0_HOST}:${PEER_PORT}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:${PEER_PORT}
      - CORE_PEER_CHAINCODEADDRESS=${PEER0_HOST}:${CHAINCODE_PORT}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:${CHAINCODE_PORT}
      - CORE_PEER_GOSSIP_BOOTSTRAP=${LOCAL_BOOTSTRAP_PEER}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=${PEER0_HOST}:${PEER_PORT}
      - CORE_PEER_LOCALMSPID=${LAB_MSP_ID}
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../.generated/fabric-samples/config:/etc/hyperledger/peercfg
      - ../organizations/peerOrganizations/lab.example.com/peers/peer0.lab.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/lab.example.com/peers/peer0.lab.example.com/tls:/etc/hyperledger/fabric/tls
      - ../data/peer0:/var/hyperledger/production
    ports:
      - "${PEER_PORT}:${PEER_PORT}"
    depends_on:
      - couchdb-peer0
      - ipfs.lab.example.com
    networks:
      - fabric

networks:
  fabric:
    name: ${FABRIC_NETWORK}

volumes:
  ipfs-data:
  explorer-db-data:
  explorer-wallet:

